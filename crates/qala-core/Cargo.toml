[package]
name = "qala-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Pure Qala logic shared by phone, web and server: engine, availability, HLC, adapter, derived numbers. No I/O, no clock."

[dependencies]
qala-lspp = { path = "../qala-lspp" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
