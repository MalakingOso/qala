[package]
name = "qala-lspp-wasm"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "wasm-bindgen exports of the liftoscript evaluation API (web, Deno)."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
qala-lspp-json = { path = "../qala-lspp-json" }
wasm-bindgen = "0.2"

[dev-dependencies]
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
