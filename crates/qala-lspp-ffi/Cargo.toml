[package]
name = "qala-lspp-ffi"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "UniFFI exports of the liftoscript evaluation API (Kotlin)."

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["cli"]

[features]
cli = ["uniffi/cli"]

[dependencies]
qala-lspp-json = { path = "../qala-lspp-json" }
uniffi = "0.32"

[dev-dependencies]
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
