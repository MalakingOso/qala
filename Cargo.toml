[workspace]
resolver = "2"
members = ["crates/qala-lspp", "crates/qala-lspp-json", "crates/qala-lspp-wasm", "crates/qala-ffi", "crates/qala-core"]

[workspace.package]
edition = "2021"
license = "AGPL-3.0-or-later"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# Faster Android builds for the emulator and debug APKs: same panic strategy as release, no fat LTO.
[profile.android-dev]
inherits = "release"
opt-level = 1
lto = false
codegen-units = 16
strip = false
